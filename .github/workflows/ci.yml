name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check WordPress library endpoints and statistics
        run: |
          php -l wordpress/lctp-library-stats.php
          php tests/test_wordpress_library_sync.php
          php tests/test_wordpress_library_stats.php
          php tests/test_wordpress_library_stats_periods.php
      - run: npm run package:plugin
