name: Release plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:plugin
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/main.js dist/manifest.json dist/styles.css
          --verify-tag
          --title "Lacan Translation Helper $GITHUB_REF_NAME"
          --generate-notes
